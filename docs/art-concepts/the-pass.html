// agent drawer on the right (440–640). Vector art; text is emitted at its real
// pixel size under an inverse scale so letters never spread at small sizes.

const UIF = "system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif";

function render(themeId, s) {
  const T = THEMES[themeId], F = themeId === "fantasy";
  const out = [], late = [];

  const el = (t, o, inner = "") => out.push(`<${t} ${A(o)}>${inner}</${t}>`);

  const rect = (x, y, w, h, fill, o = {}) => el("rect", { x, y, width: w, height: h, fill, ...o });

  const text = (x, y, t, fill, size, weight = 600, o = {}) => { const { transform, ...rest } = o; el("text", { x: x * s, y: y * s, fill, "font-size": size * s, "font-weight": weight, "font-family": UIF, "dominant-baseline": "hanging", ...rest, transform: `${transform ?? ""} scale(${1 / s})` }, String(t).replace(/&/g, "&amp;")); };
  const mctx = document.createElement("canvas").getContext("2d");

    <filter id="shs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx=".5" dy=".9" stdDeviation=".5" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>

    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7fa"/><stop offset=".5" stop-color="#c9d1dc"/><stop offset="1" stop-color="#8e98a8"/></linearGradient>

  slip(2, 0, "3.1", "review");
  ["2.9", "2.8"].forEach((id, k) => slip(3, k, id, null));

  // ---- Head Chef: hearth / galley hood (top centre)
  if (F) {
    rect(184, 30, 82, 36, "url(#stone)", { rx: 2, ...SH }); path("M196 66 v-20 q0 -12 29 -12 q29 0 29 12 v20z", "#2a1d16");
    circ(225, 58, 22, "url(#warm)"); path("M210 66 q4 -14 9 -6 q3 -12 7 -2 q4 -10 7 1 q3 -6 6 7z", "url(#fire)"); rect(206, 63, 38, 3, "#3a2a20");
    path("M219 52 q6 -10 12 0 v6 h-12z", "url(#copper)", SHS); line(225, 34, 225, 46, "#3a312a", .8); // cauldron hanging in the hearth
  } else {
    rect(184, 34, 82, 22, "url(#steel)", { rx: 3, ...SH }); rect(190, 40, 70, 3, "#38d9c9", { opacity: .8 }); rect(196, 56, 58, 6, "#8e98a8", { rx: 2 });
  }
  rect(172, 70, 106, 54, F ? "#8a3a2a" : "#3a1d2f", { rx: 4, opacity: .9 }); // chef's floor: the one warm-red zone
  circ(225, 96, 46, F ? "url(#warm)" : "url(#teal)", { opacity: .7 });

  // ---- staff corner / crew lounge (right middle): seating grouped, room for more
  if (F) {
    rect(292, 70, 98, 112, "#5a3a2a", { rx: 3 }); rect(294, 72, 94, 108, "#6e4630", { rx: 2.4 });
    rect(350, 34, 36, 30, "url(#stone)", { rx: 1.5, ...SHS }); path("M356 64 v-14 q0 -8 12 -8 q12 0 12 8 v14z", "#2a1d16"); path("M360 64 q3 -9 6 -3 q2 -8 5 0 q3 -5 5 3z", "url(#fire)"); circ(368, 72, 26, "url(#warm)");
    rect(300, 88, 58, 8, "url(#woodg)", { rx: 2, ...SH }); rect(300, 148, 58, 8, "url(#woodg)", { rx: 2, ...SH }); rect(296, 96, 8, 52, "url(#woodg)", { rx: 2, ...SH }); // U bench
    rect(310, 104, 40, 34, "#8a5a34", { rx: 3, ...SH }); rect(312, 106, 36, 30, "#9c6a3e", { rx: 2.4 }); // table
    [[318, 112], [340, 112], [326, 126], [344, 128]].forEach(([x, y]) => { rect(x, y, 4.4, 5, "#c9b28a", { rx: .8, ...SHS }); ell(x + 2.2, y + .4, 2, .7, "#fff8e0"); });
    ell(372, 160, 8, 3.4, "#d08a4a", SHS); path("M366 160 q2 -5 6 -3 q4 -3 6 2", "#d08a4a"); circ(379, 158.5, 1.8, "#d08a4a"); // the cat
    late.push(() => pill(296, 74, "Staff corner"));
  } else {
    rect(292, 70, 98, 112, "#2a2346", { rx: 6 }); rect(294, 72, 94, 108, "#332a52", { rx: 5 });
    rect(296, 36, 92, 27, "url(#space)", { rx: 4, stroke: "#8e98a8", "stroke-width": 1.4 }); for (let i = 0; i < 18; i++) circ(300 + (i * 23) % 86, 39 + (i * 7) % 22, .5, "#fff"); circ(370, 56, 10, "url(#planet)"); // big viewport

    path("M302 98 q0 -10 10 -10 h60 q10 0 10 10 v6 h-8 v-4 q0 -4 -4 -4 h-56 q-4 0 -4 4 v40 q0 4 4 4 h56 q4 0 4 -4 v-4 h8 v6 q0 10 -10 10 h-60 q-10 0 -10 -10z", "#d98a52", SH); // curved sofa

    late.push(() => pill(296, 74, "Crew lounge"));

  // ---- MAIN · SERVICE (top right)
  rect(394, 34, 36, 30, T.ink, { rx: 2, ...SH }); rect(396, 36, 32, 26, T.alert, { rx: 1.6 });
  text(412, 38.5, "MAIN", T.ink, 10.5, 900, { "text-anchor": "middle", "letter-spacing": 0.3 * s }); text(412, 52, "SERVICE", T.ink, 4.8, 900, { "text-anchor": "middle", "letter-spacing": 0.4 * s });
  if (F) { path("M396 140 v-62 q0 -12 16 -12 q16 0 16 12 v62z", "url(#woodg)", SH); line(412, 70, 412, 140, "#4a2e1c", .8); circ(406, 108, 1.4, "#ffc93a"); circ(418, 108, 1.4, "#ffc93a"); }
  else { rect(396, 68, 32, 72, "#2a3456", { rx: 4, ...SH }); for (let y = 72; y < 136; y += 6) rect(399, y, 26, 4, "#c9d1dc", { rx: 1.6, opacity: .9 }); rect(396, 104, 32, 2, "#38d9c9"); }

  // ---- delivery lane to MAIN
  const ry = 300;
  rect(14, ry - 1, 398, 14, T.ink, { rx: 3, ...SH }); rect(16, ry + 1, 394, 10, T.rail, { rx: 2 }); rect(16, ry + 1, 394, 1, T.railEdge); rect(16, ry + 10, 394, 1, T.railEdge);
  rect(399, 140, 14, 172, T.ink, { rx: 3, ...SH }); rect(401, 140, 10, 170, T.rail, { rx: 2 }); rect(401, 140, 1, 170, T.railEdge); rect(410, 140, 1, 170, T.railEdge);
  if (!F) { for (let x = 22; x < 400; x += 16) rect(x, ry + 4.5, 6, 1.6, "#ffc93a", { opacity: .35 }); }
  for (let x = 24; x < 396; x += 14) path(`M${x - 1.6} ${ry + 3.2} l3.4 2.8 l-3.4 2.8`, "none", { stroke: T.arrow, "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round" });
  for (let y = 296; y > 146; y -= 14) path(`M${403.2} ${y + 3} l2.8 -3.2 l2.8 3.2`, "none", { stroke: T.arrow, "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round" });
  late.push(() => { const t = F ? "delivery lane → MAIN · SERVICE" : "CARGO RAIL → MAIN · SERVICE"; const w = tw(t, 5.2, 800) + 6; rect(150, 316, w, 9, T.zone, { rx: 2 }); text(153, 317.6, t, T.zoneFg, 5.2, 800); });

  dish(326, 306); dish(406, 214);

}
