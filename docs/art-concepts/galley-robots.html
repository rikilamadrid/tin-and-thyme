const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f); return "#" + ((1 << 24) + (Math.min(255, r) << 16) + (Math.min(255, g) << 8) + Math.min(255, b)).toString(16).slice(1); };

// ================================================================ backends
function pixelBackend(s) {
  const cv = document.createElement("canvas"); const ctx = cv.getContext("2d");
  const setSize = (w, h) => { cv.width = w * s; cv.height = h * s; ctx.imageSmoothingEnabled = false; };
  const R = (x, y, w, h, c, a) => { if (!c || w <= 0 || h <= 0) return; ctx.globalAlpha = a ?? 1; ctx.fillStyle = c; ctx.fillRect(Math.round(x) * s, Math.round(y) * s, Math.round(w) * s, Math.round(h) * s); ctx.globalAlpha = 1; };
  const rowsOfEll = (cx, cy, rx, ry) => { const out = []; for (let yy = Math.ceil(cy - ry); yy < cy + ry; yy++) { const t = (yy + .5 - cy) / ry, hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - t * t))); if (hw > 0) out.push([Math.round(cx - hw), yy, hw * 2]); } return out; };
  const api = {
    kind: "pixel", canvas: cv, setSize,
    rect: R,
    box(x, y, w, h, c, o = {}) {
      x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h); const r = o.r ?? 0;
      if (o.ink) { if (r) { R(x, y - 1, w, h + 2, INK); R(x - 1, y, w + 2, h, INK); } else R(x - 1, y - 1, w + 2, h + 2, INK); }
      if (o.inkOnly) return;
      if (r) { R(x + 1, y, w - 2, h, c); R(x, y + 1, w, h - 2, c); } else R(x, y, w, h, c);
      if (o.shade) R(x + w - Math.max(1, Math.round(w * .3)), y + (r ? 1 : 0), Math.max(1, Math.round(w * .3)) - (r ? 1 : 0), h - (r ? 2 : 0), shade(c, .78));
      if (o.hi) R(x + (r ? 1 : 0), y, w - (r ? 2 : 0), 1, shade(c, 1.18));
    },
    ell(cx, cy, rx, ry, c, o = {}) {
      if (o.ink) rowsOfEll(cx, cy, rx + 1, ry + 1).forEach(([x, yy, w]) => R(x, yy, w, 1, INK));
      if (o.inkOnly) return;
      const rows = rowsOfEll(cx, cy, rx, ry); rows.forEach(([x, yy, w]) => R(x, yy, w, 1, c));
      if (o.shade) rows.forEach(([x, yy, w]) => R(x + Math.round(w * .68), yy, w - Math.round(w * .68), 1, shade(c, .78)));
    },
    line(x1, y1, x2, y2, c, w = 1) { const n = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1)) || 1; for (let i = 0; i <= n; i++) R(Math.round(x1 + (x2 - x1) * i / n), Math.round(y1 + (y2 - y1) * i / n), w, w, c); },
    glow(cx, cy, r, c, a = .18) { for (let k = 3; k >= 1; k--) { const rr = r * k / 3; rowsOfEll(cx, cy, rr, rr * .7).forEach(([x, yy, w]) => { for (let i = 0; i < w; i++) if ((x + i + yy) % 2 === 0) R(x + i, yy, 1, 1, c, a); }); } },
    text(x, y, t, c, size, weight = 600, o = {}) { ctx.font = `${weight} ${size * s}px ${UIF}`; ctx.fillStyle = c; ctx.textBaseline = "top"; ctx.textAlign = o.anchor === "middle" ? "center" : o.anchor === "end" ? "right" : "left"; ctx.fillText(t, Math.round(x * s), Math.round(y * s + size * s * .05)); ctx.textAlign = "left"; },
    tw(t, size, weight = 600) { ctx.font = `${weight} ${size * 10}px ${UIF}`; return ctx.measureText(t).width / 10 * 1.04; },
    clip(x, y, w, h, fn) { ctx.save(); ctx.beginPath(); ctx.rect(x * s, y * s, w * s, h * s); ctx.clip(); fn(); ctx.restore(); },
    finish() { return cv; },
  };
  return api;
}
function celBackend(s) {
  let out = [], uid = 0, W = 0, H = 0;
  const A = (o) => Object.entries(o).filter(([, v]) => v !== undefined).map(([k, v]) => `${k}="${v}"`).join(" ");
  const el = (t, o, inner = "") => out.push(`<${t} ${A(o)}>${inner}</${t}>`);
  const SW = 1.05;
  const api = {
    kind: "cel", setSize(w, h) { W = w; H = h; },
    rect(x, y, w, h, c, a) { el("rect", { x, y, width: w, height: h, fill: c, opacity: a }); },
    box(x, y, w, h, c, o = {}) {
      const r = Math.min(Math.min(w, h) / 2, Math.max((o.r ?? 0) * 1.7, o.ink ? 1.2 : 0));
      if (o.inkOnly) return;
      if (o.shade) { const id = `k${uid++}`; el("clipPath", { id }, `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`); el("rect", { x, y, width: w, height: h, rx: r, fill: c }); el("path", { d: `M${x + w * .66} ${y - 1} q${-w * .08} ${h * .5} ${w * .02} ${h + 2} H${x + w + 1} V${y - 1}z`, fill: shade(c, .78), "clip-path": `url(#${id})` }); }
      else el("rect", { x, y, width: w, height: h, rx: r, fill: c });
      if (o.hi && w > 5 && h > 4) el("path", { d: `M${x + Math.min(2.2, w * .2)} ${y + h * .62} V${y + Math.min(2.2, h * .25)} h${Math.min(w * .35, 5)}`, fill: "none", stroke: "#ffffff", "stroke-width": .7, "stroke-linecap": "round", opacity: .85 });
      if (o.ink) el("rect", { x, y, width: w, height: h, rx: r, fill: "none", stroke: INK, "stroke-width": SW, "stroke-linejoin": "round" });
    },
    ell(cx, cy, rx, ry, c, o = {}) {
      if (o.inkOnly) return;
      if (o.shade) { const id = `k${uid++}`; el("clipPath", { id }, `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`); el("ellipse", { cx, cy, rx, ry, fill: c }); el("path", { d: `M${cx + rx * .3} ${cy - ry - 1} q${-rx * .25} ${ry} ${rx * .05} ${ry * 2 + 2} H${cx + rx + 1} V${cy - ry - 1}z`, fill: shade(c, .78), "clip-path": `url(#${id})` }); }
      else el("ellipse", { cx, cy, rx, ry, fill: c });
      if (o.ink) el("ellipse", { cx, cy, rx, ry, fill: "none", stroke: INK, "stroke-width": SW });
    },
    line(x1, y1, x2, y2, c, w = 1) { el("line", { x1, y1, x2, y2, stroke: c, "stroke-width": w, "stroke-linecap": "round" }); },
    glow(cx, cy, r, c, a = .12) { el("ellipse", { cx, cy, rx: r, ry: r * .7, fill: c, opacity: a }); },
    path(d, fill, o = {}) { el("path", { d, fill, ...o }); },
    text(x, y, t, c, size, weight = 600, o = {}) { el("text", { x: x * s, y: y * s, fill: c, "font-size": size * s, "font-weight": weight, "font-family": UIF, "dominant-baseline": "hanging", "text-anchor": o.anchor, transform: `scale(${1 / s})` }, String(t).replace(/&/g, "&amp;")); },
    tw(t, size, weight = 600) { const c = api._c ?? (api._c = document.createElement("canvas").getContext("2d")); c.font = `${weight} ${size * 10}px ${UIF}`; return c.measureText(t).width / 10 * 1.05; },
    clip(x, y, w, h, fn) { const id = `k${uid++}`; el("clipPath", { id }, `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`); out.push(`<g clip-path="url(#${id})">`); fn(); out.push("</g>"); },
    finish() { const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W * s); svg.setAttribute("height", H * s); svg.innerHTML = out.join(""); return svg; },
  };
  return api;
}

// ================================================================ robot drawing (same parts, both styles)
function robot(B, id, x, y, { cut = 99 } = {}) {
  const R0 = ROBOTS[id];
  const draw = () => {
    if (B.kind === "pixel") R0.parts.forEach((p) => part(B, p, x, y, { ink: true, inkOnly: true }));
    R0.parts.forEach((p) => part(B, p, x, y, { ink: B.kind === "cel", shade: !(p[6]?.noShade), hi: true }));
    R0.details.forEach(([dx, dy, w, h, c]) => B.rect(x + dx, y + dy, w, h, c));
    if (R0.eye) { const [ex, ey] = R0.eye; B.ell(x + ex, y + ey, 3, 3, INK, { ink: B.kind === "cel" }); B.ell(x + ex, y + ey, 1.8, 1.8, C.teal); B.rect(x + ex - 1, y + ey - 1, 1, 1, "#ffffff"); }
    if (B.kind === "cel") celFlair(B, id, x, y);
  };
  if (B.kind === "cel" && cut >= 99) B.ell(x + R0.w / 2, y + R0.h + .5, R0.w * .42, 1.6, "#0b1022", {});
  if (cut < 99) B.clip(x - 6, y - 6, R0.w + 12, cut + 6, draw); else draw();
}
function part(B, p, x, y, o) { const [k, px, py, w, h, c, po = {}] = p; if (k === "b") B.box(x + px, y + py, w, h, c, { r: po.r ?? 0, ...o }); else B.ell(x + px, y + py, w, h, c, o); }
// Cel-only personality: inked tool lines and motion marks
function celFlair(B, id, x, y) {

  [["Terminal", 8], ["Message", 52], ["Open ticket", 96]].forEach(([t, dx]) => { const w = Math.round(B.tw(t, 5, 800) + 10); B.rect(PX + dx, DY + 100, w, 1, T.fg); B.rect(PX + dx, DY + 110, w, 1, T.fg); B.rect(PX + dx, DY + 100, 1, 11, T.fg); B.rect(PX + dx + w - 1, DY + 100, 1, 11, T.fg); B.text(PX + dx + 5, DY + 102.6, t, T.fg, 5, 800); });
  B.text(PX, 334, "CTX gauge and crew: sample data", T.muted, 4.2, 600);
  let lx = PX; const LGY = 346;
  [["needs", "Needs you"], ["wait", "Waiting for a cook"], ["work", "Cooking"], ["review", "At the pass"], ["off", "On break"]].forEach(([k, t]) => {
    if (k === "needs") { B.rect(lx - 1, LGY - 1, 7, 7, INK); B.rect(lx, LGY, 5, 5, T.alert); icon(B, "needs", lx + .5, LGY + .5, 4, INK, T.alert); } else icon(B, k, lx, LGY, 5, k === "wait" ? T.muted : T.fg);
    B.text(lx + 7, LGY - .2, t, T.fg, 4.6, 600); lx += 7 + B.tw(t, 4.6, 600) + 6;
  });
  return B.finish();
}

function icon(B, k, x, y, sz, color, cut) {
  const u = sz / 5;
  if (B.kind === "pixel") {
    const G = { work: [".....", ".###.", ".###.", ".###.", "....."], review: [".##..", "#..#.", "#..#.", ".##..", "...##"], needs: ["..#..", ".###.", "##.##", ".###.", "..#.."], wait: ["#####", ".#.#.", "..#..", ".#.#.", "#####"], off: [".###.", "#....", "#..#.", "#....", ".###."] }[k];
    const z = Math.max(1, Math.round(u)); G.forEach((r, j) => [...r].forEach((ch, i) => ch === "#" && B.rect(Math.round(x) + i * z, Math.round(y) + j * z, z, z, color)));
    return;
  }
  if (k === "work") B.rect(x + u, y + u, u * 3, u * 3, color);
  if (k === "review") { B.ell(x + u * 2, y + u * 2, u * 1.4, u * 1.4, "none"); B.path(`M${x + u * 2} ${y + u * .5} a${u * 1.5} ${u * 1.5} 0 1 0 .01 0z`, "none", { stroke: color, "stroke-width": u * .9 }); B.line(x + u * 3, y + u * 3, x + u * 4.6, y + u * 4.6, color, u * 1.1); }
  if (k === "needs") { B.path(`M${x + u * 2.5} ${y} L${x + u * 5} ${y + u * 2.5} L${x + u * 2.5} ${y + u * 5} L${x} ${y + u * 2.5} Z`, color); B.rect(x + u * 2.1, y + u, u * .8, u * 2, cut ?? "#fff"); B.rect(x + u * 2.1, y + u * 3.4, u * .8, u * .8, cut ?? "#fff"); }
  if (k === "wait") B.path(`M${x} ${y} H${x + sz} L${x + u * 3} ${y + u * 2.5} L${x + sz} ${y + sz} H${x} L${x + u * 2} ${y + u * 2.5} Z`, color);
  if (k === "off") B.path(`M${x + u * 3.5} ${y + u * .2} A${u * 2.4} ${u * 2.4} 0 1 0 ${x + u * 3.5} ${y + u * 4.8} A${u * 1.8} ${u * 1.8} 0 1 1 ${x + u * 3.5} ${y + u * .2} Z`, color);
}

// ================================================================ lineup at actual display size
function lineup(B, style) {
  const W = 640, H = 92, P = style === "pixel";
  B.setSize(W, H); B.rect(0, 0, W, H, "#0c1226");
  B.text(8, 5, `ROBOT CREW · ${P ? "PIXEL" : "CEL-SHADED"} · actual display size`, "#a8b8d8", 5.4, 800);
  ["basil", "pepper", "roux", "ember", "sprig", "crumb", "mochi", "dash"].forEach((id, i) => {
    const c = BY[id], x = 8 + i * 79, y = 16;
    B.box(x, y, 74, 72, "#141d3a", { r: 3 }); B.rect(x + 4, y + 4, 66, 38, "#222c4a");
    const R0 = ROBOTS[id]; robot(B, id, x + 37 - Math.round(R0.w / 2), y + 40 - R0.h);
    B.text(x + 37, y + 45, c.name, "#eef6ff", 7, 800, { anchor: "middle" }); B.text(x + 37, y + 53.5, c.job, "#9fe7ff", 4.8, 700, { anchor: "middle" });
    B.text(x + 37, y + 60, c.role, "#ffc93a", 4.4, 800, { anchor: "middle" });
    B.text(x + 37, y + 66, BLURB[id].split(" · ")[1] ?? "", "#a8b8d8", 3.8, 600, { anchor: "middle" });
  });
  return B.finish();
}

// ================================================================ mount
const v = q.get("v") || "pixel";
const box = document.getElementById("out");
const make = (k, sc) => scene(k === "pixel" ? pixelBackend(sc) : celBackend(sc), k);
if (v === "all") { const row = document.createElement("div"); row.id = "row"; row.style.gap = `${10 * S}px`; row.appendChild(make("pixel", S)); row.appendChild(make("cel", S)); box.appendChild(row); }
else if (v === "lineup") { box.style.gap = `${4 * S}px`; box.appendChild(lineup(pixelBackend(S), "pixel")); box.appendChild(lineup(celBackend(S), "cel")); }
else box.appendChild(make(v, S));
</script>
