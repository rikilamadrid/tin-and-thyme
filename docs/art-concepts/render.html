<!doctype html>
<html><head><meta charset="utf-8"><title>Controlroom art concepts</title>
<style>html,body{margin:0;background:#000}canvas{display:block;image-rendering:pixelated}</style></head>
<body><canvas id="c"></canvas>
<script>
// Controlroom concept renderer. One floor plan, one moment, three settings.
// Logical canvas 336 x 300 px, drawn pixel by pixel, scaled 4x with no smoothing.
const S = 4, W = 336, H = 304, OY = 22; // scene starts at y=22
const cv = document.getElementById("c"); cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
let oy = 0;
const R = (x, y, w, h, c) => { if (!c) return; ctx.fillStyle = c; ctx.fillRect(x * S, (y + oy) * S, w * S, h * S); };
const P = (x, y, c) => R(x, y, 1, 1, c);

// ---------------------------------------------------------------- 3x5 pixel font
const F = {A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",Z:"111001010100111",
"0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110","4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110",
".":"000000000000010","-":"000000111000000",":":"000010000010000","!":"010010010000010","?":"110001010000010","/":"001001010100100",">":"100010001010100","<":"001010100010001","+":"000010111010000","'":"010010000000000",",":"000000000010100","·":"000000010000000"," ":"000000000000000","^":"010101000000000","&":"010101010101011",";":"000010000010100","#":"101111101111101"};
const tw = (s) => s.length * 4 - 1;
function text(x, y, s, c, shadow) {
  s = s.toUpperCase();
  for (let i = 0; i < s.length; i++) {
    const g = F[s[i]] ?? F["?"];
    for (let j = 0; j < 15; j++) if (g[j] === "1") { if (shadow) P(x + i * 4 + (j % 3) + 1, y + ((j / 3) | 0) + 1, shadow); }
    for (let j = 0; j < 15; j++) if (g[j] === "1") P(x + i * 4 + (j % 3), y + ((j / 3) | 0), c);
  }
}
const ctext = (cx, y, s, c, sh) => text(Math.round(cx - tw(s) / 2), y, s, c, sh);
function label(x, y, s, fg, bg) { R(x - 1, y - 1, tw(s) + 2, 7, bg); text(x, y, s, fg); }

// ---------------------------------------------------------------- sprites (12 x 16)
function spr(map, pal, x, y, rows = 16) {
  map.slice(0, rows).forEach((row, j) => [...row.padEnd(12, ".").slice(0, 12)].forEach((ch, i) => { if (ch !== ".") P(x + i, y + j, pal[ch] ?? "#f0f"); }));
}

// ---------------------------------------------------------------- icons 5x5
const ICON = {
  work: [".....", ".###.", ".###.", ".###.", "....."],
  review: [".##..", "#..#.", "#..#.", ".##..", "...##"],
  needs: ["..#..", ".###.", "##.##", ".###.", "..#.."],
  wait: ["#####", ".#.#.", "..#..", ".#.#.", "#####"],
  off: [".###.", "#....", "#..#.", "#....", ".###."],
};
const icon = (k, x, y, c) => ICON[k].forEach((r, j) => [...r].forEach((ch, i) => ch === "#" && P(x + i, y + j, c)));

// A state tag above an agent or object. Shape + word; colour is secondary.
function tag(cx, y, kind, s, T) {
  const w = tw(s) + 10, x = Math.round(cx - w / 2), h = 9;
  if (kind === "needs") {
    R(x - 2, y - 2, w + 4, h + 4, T.ink); R(x - 1, y - 1, w + 2, h + 2, T.alert); R(x, y, w, h, T.ink); R(x + 1, y + 1, w - 2, h - 2, T.alert);
    icon("needs", x + 2, y + 2, T.ink); text(x + 8, y + 2, s, T.ink);
    // pointer: a solid wedge
    R(cx - 2, y + h + 2, 5, 1, T.ink); R(cx - 1, y + h + 3, 3, 1, T.ink); P(cx, y + h + 4, T.ink);
    return;
  }
  if (kind === "wait") {
    R(x, y, w, h, T.tagBg);
    for (let i = 0; i < w; i += 2) { P(x + i, y, T.muted); P(x + i, y + h - 1, T.muted); }
    for (let j = 0; j < h; j += 2) { P(x, y + j, T.muted); P(x + w - 1, y + j, T.muted); }
    icon("wait", x + 2, y + 2, T.muted); text(x + 8, y + 2, s, T.muted);
    P(cx, y + h, T.muted); P(cx, y + h + 2, T.muted);
    return;
  }
  R(x, y, w, h, T.ink); R(x + 1, y + 1, w - 2, h - 2, T.tagBg);
  icon(kind, x + 2, y + 2, T.tagFg); text(x + 8, y + 2, s, T.tagFg);
  R(cx - 1, y + h, 3, 1, T.ink); P(cx, y + h + 1, T.ink);
}
const plate = (cx, y, s, T) => { const w = tw(s) + 4, x = Math.round(cx - w / 2); R(x, y, w, 7, T.plateBg); R(x, y + 6, w, 1, T.ink); text(x + 2, y + 1, s, T.plateFg); };

// ---------------------------------------------------------------- belt
function belt(T) {
  const y = 184, x0 = 12, xT = 298; // horizontal run, then up the right column into MAIN
  R(x0, y - 1, xT - x0 + 10, 12, T.ink); R(x0, y, xT - x0 + 10, 10, T.belt); R(x0, y, xT - x0 + 10, 1, T.beltEdge); R(x0, y + 9, xT - x0 + 10, 1, T.beltEdge);
  R(xT - 1, 92, 12, 102, T.ink); R(xT, 92, 10, 101, T.belt); R(xT, 92, 1, 101, T.beltEdge); R(xT + 9, 92, 1, 101, T.beltEdge);
  for (let x = x0 + 6; x < xT - 4; x += 10) { const a = T.arrow; P(x, y + 3, a); P(x + 1, y + 4, a); P(x + 2, y + 5, a); P(x + 1, y + 6, a); P(x, y + 7, a); P(x - 1, y + 3, a); P(x, y + 4, a); P(x + 1, y + 5, a); P(x, y + 6, a); P(x - 1, y + 7, a); }
  for (let yy = 182; yy > 96; yy -= 10) { const a = T.arrow; P(xT + 2, yy + 2, a); P(xT + 3, yy + 1, a); P(xT + 4, yy, a); P(xT + 5, yy + 1, a); P(xT + 6, yy + 2, a); P(xT + 3, yy + 2, a); P(xT + 4, yy + 1, a); P(xT + 5, yy + 2, a); }
}
function parcel(x, y, id, T) {
  R(x - 1, y - 1, 11, 9, T.ink); R(x, y, 9, 7, T.parcel); R(x, y, 9, 1, T.parcelHi); R(x + 4, y, 1, 7, T.tape);
  label(x + 5 - tw(id) / 2 | 0, y - 9, id, T.panelFg, T.ink);
}
