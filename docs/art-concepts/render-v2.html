<script>
// Controlroom concept renderer, polish pass (v2).
// Every scene shares one floor plan and one moment on a 336 x 308 logical grid.
// ?t=office|ship|guild renders one scene; ?t=all renders the three side by side.
// ?s=<whole number> is the pixel scale. No fractional scaling anywhere.
const q = new URLSearchParams(location.search);
const S = Math.max(1, Math.round(Number(q.get("s") || 4)));
const SW = 336, SH = 308, OY = 24, GAP = 10;
const which = q.get("t") || "office";
const list = which === "all" ? ["office", "ship", "guild"] : [which];
const W = list.length * SW + (list.length - 1) * GAP, H = SH;
const cv = document.getElementById("c"); cv.width = W * S; cv.height = H * S;
const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
let ox = 0, oy = 0;
const R = (x, y, w, h, c) => { if (!c) return; ctx.fillStyle = c; ctx.fillRect((x + ox) * S, (y + oy) * S, w * S, h * S); };
const P = (x, y, c) => R(x, y, 1, 1, c);

// ---------------------------------------------------------------- pixel font (3x5), drawn at 1x or 2x of the grid
const F = {A:"010101111101101",B:"110101110101110",C:"011100100100011",D:"110101101101110",E:"111100110100111",F:"111100110100100",G:"011100101101011",H:"101101111101101",I:"111010010010111",J:"001001001101010",K:"101101110101101",L:"100100100100111",M:"101111111101101",N:"110101101101101",O:"010101101101010",P:"110101110100100",Q:"010101101110011",R:"110101110101101",S:"011100010001110",T:"111010010010010",U:"101101101101111",V:"101101101101010",W:"101101111111101",X:"101101010101101",Y:"101101010010010",Z:"111001010100111",
"0":"111101101101111","1":"010110010010111","2":"110001010100111","3":"110001010001110","4":"101101111001001","5":"111100110001110","6":"011100111101111","7":"111001010010010","8":"111101111101111","9":"111101111001110",
".":"000000000000010","-":"000000111000000",":":"000010000010000","!":"010010010000010","?":"110001010000010","/":"001001010100100",">":"100010001010100","^":"010101000000000"," ":"000000000000000","%":"101001010100101"};
const pw = (s, z = 1) => s.length * 4 * z - z;
function ptext(x, y, s, c, z = 1) {
  s = s.toUpperCase();
  for (let i = 0; i < s.length; i++) { const g = F[s[i]] ?? F["?"]; for (let j = 0; j < 15; j++) if (g[j] === "1") R(x + (i * 4 + (j % 3)) * z, y + ((j / 3) | 0) * z, z, z, c); }
}

// ---------------------------------------------------------------- clean UI font for secondary text (positions snapped to the grid)
const UIF = 'system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif';
function ufont(size, weight) { ctx.font = `${weight} ${size * S}px ${UIF}`; }
function uw(s, size = 6, weight = 600) { ufont(size, weight); return Math.ceil(ctx.measureText(s).width / S); }
function utext(x, y, s, c, size = 6, weight = 600) { ufont(size, weight); ctx.fillStyle = c; ctx.textBaseline = "top"; ctx.fillText(s, (x + ox) * S, (y + oy) * S + Math.round(size * S * 0.04)); }
/** A pill label in the UI font: zone names, name plates. */
function pill(x, y, s, fg, bg, size = 6, weight = 700, center = false) { const w = uw(s, size, weight) + 4; const xx = center ? Math.round(x - w / 2) : x; R(xx, y, w, size + 3, bg); utext(xx + 2, y + 1, s, fg, size, weight); return w; }

// ---------------------------------------------------------------- sprites (16 x 20)
function spr(map, pal, x, y, rows = 20) { map.slice(0, rows).forEach((row, j) => [...row.padEnd(16, ".").slice(0, 16)].forEach((ch, i) => { if (ch !== ".") P(x + i, y + j, pal[ch] ?? "#f0f"); })); }
// 1px dark outline around a sprite so its silhouette separates from any floor
function outlined(map, pal, x, y, rows, ink) {
  const m = map.slice(0, rows).map((r) => r.padEnd(16, ".").slice(0, 16));
  const solid = (i, j) => j >= 0 && j < m.length && i >= 0 && i < 16 && m[j][i] !== ".";
  for (let j = -1; j <= m.length; j++) for (let i = -1; i <= 16; i++) if (!solid(i, j) && (solid(i - 1, j) || solid(i + 1, j) || solid(i, j - 1) || solid(i, j + 1))) P(x + i, y + j, ink);
  spr(map, pal, x, y, rows);
}

// ---------------------------------------------------------------- icons 5x5
const ICON = { work: [".....", ".###.", ".###.", ".###.", "....."], review: [".##..", "#..#.", "#..#.", ".##..", "...##"], needs: ["..#..", ".###.", "##.##", ".###.", "..#.."], wait: ["#####", ".#.#.", "..#..", ".#.#.", "#####"], off: [".###.", "#....", "#..#.", "#....", ".###."] };
const icon = (k, x, y, c, z = 1) => ICON[k].forEach((r, j) => [...r].forEach((ch, i) => ch === "#" && R(x + i * z, y + j * z, z, z, c)));

// ---------------------------------------------------------------- status tags (first read: NEEDS YOU > ticket IDs)
function needsTag(cx, y, T) {
  const s = "NEEDS YOU", w = pw(s, 2) + 16, h = 16, x = Math.round(cx - w / 2);
  R(x - 2, y - 2, w + 4, h + 4, T.ink); R(x - 1, y - 1, w + 2, h + 2, T.alert); R(x, y, w, h, T.ink); R(x + 1, y + 1, w - 2, h - 2, T.alert);
  icon("needs", x + 2, y + 3, T.ink, 2); ptext(x + 14, y + 3, s, T.ink, 2);
  R(cx - 3, y + h + 2, 7, 1, T.ink); R(cx - 2, y + h + 3, 5, 1, T.ink); R(cx - 1, y + h + 4, 3, 1, T.ink); P(cx, y + h + 5, T.ink);
}
/** Worker / reviewer tag: big ticket ID, small role word. Optional CTX meter row. */
function ticketTag(cx, y, kind, id, role, T, ctxPct) {
  const idW = uw(id, 8, 800), roleW = uw(role, 5, 700), w = Math.max(3 + 6 + idW + 2 + roleW + 3, ctxPct == null ? 0 : 44), h = ctxPct == null ? 12 : 19, x = Math.round(cx - w / 2);
  R(x, y, w, h, T.ink); R(x + 1, y + 1, w - 2, h - 2, T.tagBg);
  icon(kind, x + 3, y + 3, T.tagFg); utext(x + 9, y + 1, id, T.tagFg, 8, 800);
  utext(x + 9 + idW + 2, y + 3, role, T.roleFg, 5, 700);
  if (ctxPct != null) {
    R(x + 1, y + 11, w - 2, 1, T.ctxOff);
    utext(x + 3, y + 12, "CTX", T.tagFg, 4.5, 800);
    const segs = 8, on = Math.round((ctxPct / 100) * segs), sx = x + 14;
    for (let i = 0; i < segs; i++) { R(sx + i * 2, y + 13, 1, 4, i < on ? T.tagFg : T.ctxOff); }
    utext(sx + segs * 2 + 2, y + 12, `${ctxPct}%`, T.tagFg, 4.5, 800);
  }
  R(cx - 1, y + h, 3, 1, T.ink); P(cx, y + h + 1, T.ink);
}
function waitTag(cx, y, id, T) {
  const word = "needs a worker", w = 2 + 7 + uw(id, 6, 800) + 3 + uw(word, 5, 600) + 3, h = 10, x = Math.round(cx - w / 2);
  R(x, y, w, h, T.floorQuiet);
  for (let i = 0; i < w; i += 2) { P(x + i, y, T.muted); P(x + i, y + h - 1, T.muted); }
  for (let j = 0; j < h; j += 2) { P(x, y + j, T.muted); P(x + w - 1, y + j, T.muted); }
  icon("wait", x + 3, y + 2, T.muted); utext(x + 9, y + 1, id, T.muted, 6, 800); utext(x + 9 + uw(id, 6, 800) + 3, y + 2, word, T.muted, 5, 600);
  P(cx, y + h + 1, T.muted); P(cx, y + h + 3, T.muted);
}
function offTag(cx, y, T) {
  const s = "OFF DUTY", w = 2 + 7 + uw(s, 5.5, 700) + 3, h = 10, x = Math.round(cx - w / 2);
  R(x, y, w, h, T.ink); R(x + 1, y + 1, w - 2, h - 2, T.tagBg); icon("off", x + 3, y + 2, T.tagFg); utext(x + 9, y + 2, s, T.roleFg, 5.5, 700);
  R(cx - 1, y + h, 3, 1, T.ink);
}
const plate = (cx, y, s, T) => pill(cx, y, s, T.plateFg, T.plateBg, 5.5, 700, true);

// ---------------------------------------------------------------- belt, parcels, MAIN
function belt(T) {
  const y = 184, x0 = 12, xT = 298;
  R(x0, y - 1, xT - x0 + 10, 12, T.ink); R(x0, y, xT - x0 + 10, 10, T.belt); R(x0, y, xT - x0 + 10, 1, T.beltEdge); R(x0, y + 9, xT - x0 + 10, 1, T.beltEdge);
  R(xT - 1, 92, 12, 102, T.ink); R(xT, 92, 10, 101, T.belt); R(xT, 92, 1, 101, T.beltEdge); R(xT + 9, 92, 1, 101, T.beltEdge);
  const chev = (x, yy) => { for (let k = 0; k < 2; k++) { P(x - 1 + k, yy + 2, T.arrow); P(x + k, yy + 3, T.arrow); P(x + 1 + k, yy + 4, T.arrow); P(x + k, yy + 5, T.arrow); P(x - 1 + k, yy + 6, T.arrow); } };
  for (let x = x0 + 8; x < xT - 4; x += 12) chev(x, y + 1);
  for (let yy = 180; yy > 96; yy -= 12) for (let k = 0; k < 2; k++) { P(xT + 2, yy + 3 - k, T.arrow); P(xT + 3, yy + 2 - k, T.arrow); P(xT + 4, yy + 1 - k, T.arrow); P(xT + 5, yy + 2 - k, T.arrow); P(xT + 6, yy + 3 - k, T.arrow); }
}
function parcel(x, y, T) { R(x - 1, y - 1, 11, 9, T.ink); R(x, y, 9, 7, T.parcel); R(x, y, 9, 1, T.parcelHi); R(x + 4, y, 1, 7, T.tape); }
function idFlag(cx, y, id, T) { const w = uw(id, 8, 800) + 6, x = Math.round(cx - w / 2); R(x, y, w, 12, T.ink); R(x + 1, y + 1, w - 2, 10, T.tagBg); utext(x + 3, y + 1, id, T.tagFg, 8, 800); R(cx - 1, y + 12, 3, 2, T.ink); }
function mainSign(T) {
  R(284, 14, 38, 26, T.ink); R(286, 16, 34, 22, T.mainBg); ptext(303 - Math.floor(pw("MAIN", 2) / 2), 19, "MAIN", T.mainFg, 2);
  const sub = T.mainSub; utext(303 - Math.floor(uw(sub, 5, 700) / 2), 30, sub, T.mainFg, 5, 700);
}

    utext(x + 8, y - 1, s, T.panelFg, 5.5, 600);
  });
  utext(lx, ly + 37, "CTX meter: sample data", T.panelMuted, 4.5, 600);
  // one sentence on readability
  const words = T.sentence.split(" "); let line = "", lines = [];
  for (const w of words) { if (uw(line + " " + w, 5.5, 500) > SW - 12) { lines.push(line.trim()); line = w; } else line += " " + w; }
  lines.push(line.trim());
  lines.forEach((l, i) => utext(6, SH - 17 + i * 7, l, T.panelFg, 5.5, 500));
}

ctx.fillStyle = "#0c0b10"; ctx.fillRect(0, 0, cv.width, cv.height);
list.forEach((t, i) => drawScene(THEMES[t], i * (SW + GAP)));
document.title = list.join("+");
</script>
